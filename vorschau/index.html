<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vorschau · Titelbild interaktiv</title><meta name="robots" content="noindex"><style>
:root{--bg:#19202a}body{margin:0;background:var(--bg);color:#e2e8f0;font-family:system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px}.top{font-size:11px;letter-spacing:.1em;color:#94a3b8}
h1{margin:4px 0 10px;font-size:34px;color:#fff}nav{display:flex;gap:22px;justify-content:center;font-size:14px;font-weight:600;flex-wrap:wrap}nav span:first-child{color:#60a5fa;border-bottom:2px solid #60a5fa}
.hero{margin:6px -20px 0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 75%,transparent 100%),linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 75%,transparent 100%),linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);mask-composite:intersect}
.hero svg{width:100%;display:block}
.card{background:#1f2835;border-radius:14px;padding:16px 20px;margin-top:-28px;position:relative;font-size:14px}
.demo{position:fixed;right:12px;bottom:12px;background:#0e131acc;padding:8px;border-radius:10px;font-size:12px;display:flex;gap:6px}
.demo button{background:#26303d;color:#e2e8f0;border:1px solid #ffffff22;border-radius:8px;padding:5px 9px;cursor:pointer}
.fx{transition:opacity .8s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}@keyframes rf{0%{transform:translateY(-30px);opacity:0}20%{opacity:.8}100%{transform:translate(-40px,560px);opacity:0}}
@keyframes sf{0%{transform:translateY(-20px)}100%{transform:translate(30px,580px)}}@keyframes fd{0%,100%{transform:translateX(-3%)}50%{transform:translateX(3%)}}@keyframes lp{0%,100%{opacity:.75}50%{opacity:1}}
</style></head><body><div class="wrap"><div class="top">BRESSER 8-IN-1</div><h1>Private Wetterstation Bad König</h1>
<nav><span>Aktuell Bad König</span><span>Aktuell Odenwald</span><span>Vorhersage</span><span>Grafiken</span><span>Historie</span><span>Statistik</span><span>Klima</span><span>Station</span><span>Webcams</span></nav>
<div class="hero"><svg viewBox="0 0 1600 552" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="lg"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset=".4" stop-color="#f59e0b" stop-opacity=".35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbd5e1" stop-opacity="0"/><stop offset="1" stop-color="#cbd5e1" stop-opacity=".6"/></linearGradient></defs>
<g id="paint" style="transition:transform .6s ease-out"><image href="schlossplatz.jpg" x="-16" y="-8" width="1632" height="568" preserveAspectRatio="none"/></g>
<rect id="night" class="fx" width="1600" height="552" fill="#0b1630" style="mix-blend-mode:multiply" opacity="0"/>
<rect id="grey" class="fx" width="1600" height="552" fill="#5b6675" style="mix-blend-mode:color" opacity="0"/>
<g id="stars" class="fx" opacity="0"></g>
<g id="lamps" class="fx" opacity="0"></g>
<g id="fogl" class="fx" opacity="0"><rect x="-80" y="330" width="1760" height="222" fill="url(#fog)" style="animation:fd 16s ease-in-out infinite"/></g>
<g id="rain" class="fx" opacity="0"></g><g id="snow" class="fx" opacity="0"></g></svg></div>
<div class="card" style="margin-bottom:12px"><b>Erkannt:</b> <span id="status">lade Stationswerte …</span></div><div class="card" style="margin-top:0"><b>Amtliche Warnungen für Odenwaldkreis</b><br><span style="opacity:.7">Dauerregen bis morgen 0 Uhr · Glätte morgen 2–9 Uhr</span></div></div>
<div class="demo">Testen: <button onclick="auto()">🔄 Automatisch</button><button onclick="setMode('day')">☀️ Tag</button><button onclick="setMode('night')">🌙 Nacht</button><button onclick="setMode('rain')">🌧 Regen</button><button onclick="setMode('fog')">🌫 Nebel</button><button onclick="setMode('snow')">❄️ Schnee</button></div>
<script>
const ns='http://www.w3.org/2000/svg';let s=3;const r=()=>(s=s*16807%2147483647)/2147483647;
function el(t,a,p){const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
const St=document.getElementById('stars');for(let i=0;i<70;i++){const x=r()*1600,y=r()*200;if(x>650&&x<1050&&y>60)continue;el('circle',{cx:x,cy:y,r:(r()*1.4+.6).toFixed(1),fill:'#fff',style:`animation:tw ${2+r()*3}s ease-in-out ${r()*3}s infinite`},St)}
el('circle',{cx:1320,cy:70,r:60,fill:'#e2e8f0',opacity:.12},St);el('circle',{cx:1320,cy:70,r:24,fill:'#f1f5f9'},St);
const L=document.getElementById('lamps');
[[468,410,40],[940,382,46],[1575,352,40],[298,418,30],[1073,395,30],[1150,395,30],[666,398,30]].forEach(([x,y,R])=>el('circle',{cx:x,cy:y,r:R,fill:'url(#lg)',style:'animation:lp 4s ease-in-out infinite;mix-blend-mode:screen'},L));
// warmes Fensterlicht
[[190,300],[250,300],[600,300],[640,300],[1060,300],[1140,300],[1200,320],[1220,330],[1040,375],[340,320]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:34,fill:'url(#lg)',opacity:.55,style:'mix-blend-mode:screen'},L));
const R=document.getElementById('rain');for(let i=0;i<130;i++){const x=r()*1680,y=r()*500;el('line',{x1:x,y1:y,x2:x-9,y2:y+20,stroke:'#bae6fd','stroke-width':1.4,'stroke-linecap':'round',style:`animation:rf ${.6+r()*.4}s linear ${r()*1.5}s infinite`},R)}
const Sn=document.getElementById('snow');for(let i=0;i<160;i++){const x=r()*1650-40,y=r()*540;el('circle',{cx:x,cy:y,r:(r()*2+1).toFixed(1),fill:'#fff',opacity:.85,style:`animation:sf ${5+r()*5}s linear ${-r()*8}s infinite`},Sn)}
const M={day:{night:0,grey:0,stars:0,lamps:0,fogl:0,rain:0,snow:0},night:{snow:0,night:.78,grey:0,stars:1,lamps:1,fogl:.15,rain:0},
rain:{snow:0,night:.35,grey:.55,stars:0,lamps:.6,fogl:.5,rain:1},snow:{night:.25,grey:.35,stars:0,lamps:.5,fogl:.3,rain:0,snow:1},fog:{snow:0,night:.15,grey:.6,stars:0,lamps:.4,fogl:1,rain:0}};
function setMode(k){for(const id in M[k])document.getElementById(id).setAttribute('opacity',M[k][id])}

function setFx(v){for(const id in v)document.getElementById(id).setAttribute('opacity',v[id])}
// Sonnenstand Bad König (49.74 N, 9.00 E)
function sunAlt(d){const rad=Math.PI/180,J=d/86400000+2440587.5-2451545,L=(280.46+.9856474*J)%360,g=(357.528+.9856003*J)%360*rad,
 lam=(L+1.915*Math.sin(g)+.02*Math.sin(2*g))*rad,eps=23.439*rad,dec=Math.asin(Math.sin(eps)*Math.sin(lam)),ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),
 gm=(280.46061837+360.98564736629*J)%360,H=(gm+9.0-ra/rad)*rad,lat=49.74*rad;return Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H))/rad}
let live=null;
function auto(){const alt=sunAlt(Date.now());const dark=alt<-6?1:alt<2?(2-alt)/8:0;
 const v={night:.78*dark,grey:0,stars:dark>.6?1:0,lamps:Math.min(1,dark*1.2),fogl:0,rain:0,snow:0};const t=[alt<-6?'Nacht':alt<2?'Dämmerung':'Tag'];
 if(live){const m=live.metric,pr=m.precipRate||0,T=m.temp,hu=live.humidity,w=m.windSpeed||0;
  if(pr>0&&T<=1.5){v.snow=1;v.grey=.35;t.push(`Schnee (${T.toFixed(1).replace('.',',')} °C)`)}
  else if(pr>0){v.rain=1;v.grey=.55;v.night=Math.max(v.night,.35);v.fogl=.4;v.lamps=Math.max(v.lamps,.5);t.push(`Regen (${pr.toFixed(1).replace('.',',')} mm/h)`)}
  if(hu>=97&&w<6&&!pr){v.fogl=1;v.grey=Math.max(v.grey,.6);t.push(`Nebel (Feuchte ${hu} %)`)}
  t.push(`Station: ${T.toFixed(1).replace('.',',')} °C, ${hu} %, Stand ${live.obsTimeLocal.slice(11,16)} Uhr`)}
 else t.push('Stationswerte nicht erreichbar – nur Tageszeit');
 setFx(v);document.getElementById('status').textContent=t.join(' · ')}
const q=new URLSearchParams(location.search).get('m');
fetch('https://wetter-badkoenig.sakomobil.workers.dev/',{cache:'no-store'}).then(r=>r.json()).then(j=>{live=j.observations[0]}).catch(()=>fetch('../data/live.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{live=j.cur.observations[0]}).catch(()=>{})).finally(()=>{q?setMode(q):auto()});
setInterval(()=>{if(!q)auto()},60000);
const P=document.getElementById('paint'),hero=document.querySelector('.hero');
hero.addEventListener('mousemove',e=>{const b=hero.getBoundingClientRect(),dx=(e.clientX-b.left)/b.width-.5,dy=(e.clientY-b.top)/b.height-.5;P.style.transform=`translate(${-dx*14}px,${-dy*6}px)`});
hero.addEventListener('mouseleave',()=>P.style.transform='');
</script></body></html>
