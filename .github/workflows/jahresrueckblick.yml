name: Jahresrückblick-Video
on:
  schedule:
    - cron: '15 16 30 12 *'   # 30.12. 17:15 Uhr: Video bauen (gepostet wird um 18 Uhr mit dem Abend-Weckruf)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-schreiben
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5
      - run: pip install pillow numpy edge-tts
      - run: python .github/scripts/jahresrueckblick.py
      - name: Speichern
        run: |
          git config user.name "wetter-bot"; git config user.email "actions@users.noreply.github.com"
          git add fb/jahr.mp4 fb/jahr.json; git diff --cached --quiet && exit 0
          git commit -m "Jahresrückblick-Video $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
