name: Newsticker
on:
  workflow_dispatch:
    inputs:
      aktiv: { description: 'ja = Ticker anzeigen, nein = ausblenden', default: 'ja' }
      eintraege: { description: 'JSON-Liste [{"text":"…","link":"elnino.html"}]', default: '[]' }
permissions:
  contents: write
concurrency:
  group: repo-schreiben
  cancel-in-progress: false
jobs:
  speichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ticker schreiben
        env:
          AKTIV: ${{ inputs.aktiv }}
          EINTRAEGE: ${{ inputs.eintraege }}
        run: |
          python3 - <<'PY'
          import json, os, re, datetime, zoneinfo
          try: E = json.loads(os.environ.get('EINTRAEGE') or '[]')
          except Exception: raise SystemExit('Einträge sind kein gültiges JSON')
          out = []
          for e in (E if isinstance(E, list) else [])[:6]:
              t = str((e or {}).get('text', '')).strip()[:160]
              l = str((e or {}).get('link', '')).strip()[:300]
              if not t: continue
              if l and not re.match(r'^(https?://|[\w.\-/#]+\.html)', l): l = ''
              out.append({'text': t, 'link': l})
          now = datetime.datetime.now(zoneinfo.ZoneInfo('Europe/Berlin')).strftime('%Y-%m-%dT%H:%M')
          d = {'aktiv': os.environ.get('AKTIV', 'ja').strip().lower() in ('ja', 'true', '1'), 'geaendert': now, 'eintraege': out}
          open('data/ticker.json', 'w', encoding='utf-8').write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(d, ensure_ascii=False))
          PY
      - name: Speichern
        run: |
          git config user.name "wetter-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/ticker.json; git diff --cached --quiet && exit 0
          git commit -m "Newsticker aktualisiert"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
