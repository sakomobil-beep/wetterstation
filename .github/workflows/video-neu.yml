name: Wettervideo neu erstellen (ohne Posten)
# Von Hand über den Knopf im Bereich „Facebook“ der Zentrale: erstellt Vorhersagedaten und das Wettervideo mit Max neu.
# Postet NICHTS auf Facebook – nur zum Ansehen von Änderungen.
on:
  workflow_dispatch:
    inputs:
      art:
        description: 'Welches Video? (tag = Morgenvideo, woche = Wochenausblick, thema = Themenvideo Max erklärt, mittag = nur Tagesbeitrag Mittagswetter)'
        default: 'tag'
        type: choice
        options: [tag, woche, thema, mittag]

permissions:
  contents: write

concurrency:
  group: repo-schreiben
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: inputs.art != 'mittag'
        timeout-minutes: 5
      - run: pip install pillow numpy edge-tts
      - name: Nur Tagesbeitrag Mittagswetter neu (Bild + Text, ohne Video)
        if: inputs.art == 'mittag'
        run: python .github/scripts/fb_post.py
      - if: inputs.art != 'mittag'
        run: |
          cp fb/post.jpg fb/post.txt fb/post.json /tmp/ 2>/dev/null || true
          python .github/scripts/fb_post.py
          cp /tmp/post.jpg /tmp/post.txt /tmp/post.json fb/ 2>/dev/null || true
          if [ "${{ inputs.art }}" = "thema" ]; then python .github/scripts/themen_video.py; elif [ "${{ inputs.art }}" = "woche" ]; then python .github/scripts/wetter_video.py --woche; else python .github/scripts/wetter_video.py; fi
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A fb
          git diff --cached --quiet && exit 0
          git commit -m "${{ inputs.art == 'mittag' && 'Mittagswetter' || 'Wettervideo' }} neu erstellt (von Hand) $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
