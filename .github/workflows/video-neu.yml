name: Wettervideo neu erstellen (ohne Posten)
# Von Hand über den Knopf im Bereich „Facebook“ der Zentrale: erstellt Vorhersagedaten und das Wettervideo mit Max neu.
# Postet NICHTS auf Facebook – nur zum Ansehen von Änderungen.
# Seit 18.11.2026: Probe-Videos kommen NICHT mehr in die Videothek der Website (PROBE=1), sondern in Google Drive
# („Wetterstation – Videos / Probevideos / <Art> / <Datum Uhrzeit>“). Ansehen weiter in der Zentrale.
on:
  workflow_dispatch:
    inputs:
      art:
        description: 'Welches Video? (tag = Morgenvideo, woche = Wochenausblick, thema = Themenvideo Max erklärt, mittag = Mittagsbeitrag mit der Kreiskarte, abend = Abendvideo aus dem Studio, special-test = Probe-Special bei extremem Gewitter (fb/special-test.mp4, nie gepostet), monat = Monatsrückblick, wissen = Wetterwissen mit Max)'
        default: 'tag'
        type: choice
        options: [tag, stories, woche, thema, mittag, abend, monat, wissen, premiere, polarwirbel, vulkan, sommer, special-test, warnbild]

permissions:
  contents: write

concurrency:
  group: videobau
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROBE: '1'   # wetter_video.py archiv(): Probe-Videos nicht in die Videothek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: inputs.art != 'mittag' && inputs.art != 'stories'
        timeout-minutes: 5
        continue-on-error: true
      - name: ffmpeg-Reserve (falls die Einrichtung oben ausfällt, 19.11.2026)
        if: inputs.art != 'mittag' && inputs.art != 'stories'
        run: command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - run: pip install pillow numpy edge-tts
      - name: Story-Bilder neu (Morgen-, Mittags-, Abend-Story, ohne Posten)
        if: inputs.art == 'stories'
        run: python .github/scripts/fb_post.py --nur-stories
      - name: Mittagsbeitrag neu (Karte des Kreises, ohne Video)
        if: inputs.art == 'mittag'
        run: python .github/scripts/fb_post.py --mittag
      - name: Monatsrückblick neu (Vormonat, ohne Posten)
        if: inputs.art == 'monat'
        run: python .github/scripts/monatsrueckblick.py
      - if: inputs.art != 'mittag' && inputs.art != 'monat' && inputs.art != 'stories'
        run: |
          if [ "${{ inputs.art }}" = "wissen" ]; then python .github/scripts/wissen_video.py --neu; exit 0; fi
          if [ "${{ inputs.art }}" = "polarwirbel" ]; then python .github/scripts/polarwirbel_video.py; exit 0; fi   # Themenvideo Polarwirbel (kein Autopost)
          if [ "${{ inputs.art }}" = "vulkan" ]; then python .github/scripts/vulkan_video.py; exit 0; fi   # Themenvideo Vulkane (kein Autopost)
          if [ "${{ inputs.art }}" = "sommer" ]; then python .github/scripts/sommer_video.py; exit 0; fi   # Themenvideo Sommer 2026 (kein Autopost)
          if [ "${{ inputs.art }}" = "premiere" ]; then python .github/scripts/wissen_video.py --premiere=2026-11-15; exit 0; fi   # Premiere Wetterwissen (Autopost So 15.11. 15 Uhr)   # Wetterwissen braucht keine neuen Vorhersagedaten
          cp fb/post.txt fb/post.json /tmp/ 2>/dev/null || true
          python .github/scripts/fb_post.py
          cp /tmp/post.txt /tmp/post.json fb/ 2>/dev/null || true
          if [ "${{ inputs.art }}" = "wissen" ]; then python .github/scripts/wissen_video.py; elif [ "${{ inputs.art }}" = "thema" ]; then python .github/scripts/themen_video.py; elif [ "${{ inputs.art }}" = "woche" ]; then python .github/scripts/wetter_video.py --woche; elif [ "${{ inputs.art }}" = "warnbild" ]; then python .github/scripts/unwetter_check.py --bild; elif [ "${{ inputs.art }}" = "special-test" ]; then python .github/scripts/wetter_video.py --test-gewitter; elif [ "${{ inputs.art }}" = "abend" ]; then python .github/scripts/fb_post.py --abend && python .github/scripts/wetter_video.py --abend; else python .github/scripts/wetter_video.py; fi
      - name: Probe-Video in Google Drive ablegen (statt Videothek)
        if: contains(fromJSON('["tag","woche","abend","monat","wissen","special-test"]'), inputs.art)
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          case "${{ inputs.art }}" in
            tag) D=wetter.mp4 ;; woche) D=woche.mp4 ;; abend) D=abendvideo.mp4 ;; monat) D=monat.mp4 ;; wissen) D=wissen.mp4 ;; special-test) D=special-test.mp4 ;;
          esac
          python .github/scripts/drive_ablage.py --probe "$D" || echo "Drive-Ablage des Probe-Videos nicht gelungen"
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A fb
          git diff --cached --quiet && exit 0
          git commit -m "${{ inputs.art == 'mittag' && 'Mittagswetter' || inputs.art == 'stories' && 'Story-Bilder' || 'Wettervideo' }} neu erstellt (von Hand) $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null || true; sleep 5; done
