name: Wetterarchiv (Tages- und Stundenwerte sichern)
on:
  schedule:
    - cron: '25 23 * * *'   # 0:25 Uhr Winterzeit (Reserve, Hauptauslöser: cron-job.org 0:15 Uhr)
    - cron: '25 22 * * *'   # 0:25 Uhr Sommerzeit
  workflow_dispatch:
    inputs:
      threads:
        description: 'Zugang für den Threads-Schlüssel prüfen (ändert nichts)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nebenarbeiten
  cancel-in-progress: false
jobs:
  archiv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Archiv ergänzen
        run: python .github/scripts/archiv.py
      - name: Threads-Schlüssel verlängern (montags, 19.11.2026)
        if: always()
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}   # 23.11.2026: darf nur Secrets im Repo wetterstation ändern
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: if [ "$(TZ=Europe/Berlin date +%u)" = "1" ] ; then pip install -q pynacl; python .github/scripts/threads_token.py; elif [ "${{ github.event.inputs.threads }}" = "true" ]; then pip install -q pynacl; PAT_TEST=1 python .github/scripts/threads_token.py; fi
      - name: Speichern
        run: |
          git config user.name "wetter-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/archiv; git diff --cached --quiet && exit 0
          git commit -m "Wetterarchiv bis $(TZ=Europe/Berlin date -d yesterday +'%d.%m.%Y')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null || true; sleep 5; done
