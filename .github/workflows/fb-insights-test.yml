name: Facebook/Instagram-Statistik testen (ohne Posten)
# Lauf 3: neuer Zugang 19.11.2026
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fb-insights-test.yml','.github/scripts/insights_probe.py']
concurrency: nebenarbeiten
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Kennzahlen prüfen (nur lesen)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 .github/scripts/insights_probe.py
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fb/insights-test.json
          git commit -m "Statistik-Testlauf $(date +'%d.%m.%Y %H:%M')" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
