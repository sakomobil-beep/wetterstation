name: Interaktives Titelbild ein/aus
on:
  workflow_dispatch:
    inputs:
      aktiv: { description: 'ja = interaktives Titelbild für alle Besucher, nein = normales Bild', default: 'nein' }
permissions:
  contents: write
concurrency:
  group: nebenarbeiten
  cancel-in-progress: false
jobs:
  speichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schalter schreiben
        env:
          AKTIV: ${{ inputs.aktiv }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo('Europe/Berlin')).strftime('%Y-%m-%dT%H:%M')
          d = {'aktiv': os.environ.get('AKTIV', 'nein').strip().lower() in ('ja', 'true', '1'), 'geaendert': now}
          open('data/titelbild.json', 'w', encoding='utf-8').write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          print(d)
          PY
      - name: Speichern
        run: |
          git config user.name "wetter-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/titelbild.json; git diff --cached --quiet && exit 0
          git commit -m "Interaktives Titelbild umgeschaltet"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null || true; sleep 5; done
