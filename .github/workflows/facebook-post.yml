name: Facebook-Vorhersage + Video

on:
  schedule:
    - cron: '30 4 * * *'   # 6:30 Uhr Sommerzeit: Bild, Text und Video erstellen (Website)
    - cron: '30 5 * * *'   # 6:30 Uhr Winterzeit
    - cron: '20 10 * * *'   # 12 Uhr Sommerzeit: Mittagsbeitrag (Karte des Kreises) + neue Unwetterwarnung? -> Special-Video
    - cron: '20 11 * * *'   # 12 Uhr Winterzeit
    - cron: '20 15 * * *'   # Nachmittag: neue Unwetterwarnung? -> Special-Video
    - cron: '20 5 * * 1-5'   # 7 Uhr Sommerzeit (Mo–Fr): Wettervideo auf Facebook
    - cron: '20 6 * * 1-5'   # 7 Uhr Winterzeit (Mo–Fr)
    - cron: '20 6 * * 0,6'   # 8 Uhr Sommerzeit (Sa/So): Wettervideo auf Facebook
    - cron: '20 7 * * 0,6'   # 8 Uhr Winterzeit (Sa/So)
    - cron: '20 17 * * 1-6'  # 19 Uhr Sommerzeit (Mo–Sa): Abendvideo aus dem Studio + Abend-Story
    - cron: '20 18 * * 1-6'  # 19 Uhr Winterzeit (Mo–Sa)
    - cron: '20 18 * * 0'    # Sonntag 20 Uhr Sommerzeit: Wochenausblick-Video
    - cron: '20 19 * * 0'    # Sonntag 20 Uhr Winterzeit
    - cron: '5,20,35,50 * * * *' # alle 15 Minuten, rund um die Uhr: Sondermeldungen / DWD-Warnungen prüfen
  workflow_dispatch:
  push:
    paths: ['.github/scripts/**', '.github/workflows/facebook-post.yml', 'video/hintergruende/**', 'video/musik/**']

permissions:
  contents: write
  actions: read

# Seit 16.11.2026 zwei getrennte Warteschlangen, damit sich die Läufe nicht mehr gegenseitig verdrängen:
#  fb-check  = Viertelstunden-Prüfung (Sondermeldungen, Regen-Push; DWD-Warnungen seit 18.11.2026 in dwd-warnung.yml)
#  fb-posten = Weckrufe von cron-job.org, GitHub-Rückfallzeiten (:20), Knöpfe und Code-Änderungen
concurrency:
  group: ${{ github.event.schedule == '5,20,35,50 * * * *' && 'fb-check' || 'fb-posten' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CHECK: ${{ github.event.schedule == '5,20,35,50 * * * *' && '1' || '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Open-Meteo-Reserve laden
        uses: actions/cache/restore@v4
        with:
          path: .om-reserve
          key: om-reserve-${{ github.run_id }}
          restore-keys: om-reserve-
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: github.event_name != 'schedule' || contains(fromJSON('["30 4 * * *","30 5 * * *","20 10 * * *","20 11 * * *","20 15 * * *","20 17 * * 1-6","20 18 * * 1-6","20 5 * * 1-5","20 6 * * 1-5","20 6 * * 0,6","20 7 * * 0,6","20 18 * * 0","20 19 * * 0"]'), github.event.schedule)
        timeout-minutes: 5
        continue-on-error: true   # fällt die ffmpeg-Einrichtung aus, wird trotzdem gepostet (Morgen: Video von 6:30 Uhr)
      - run: pip install pillow numpy edge-tts
      - name: Morgens – Bild, Text und Wettervideo
        if: github.event.schedule == '30 4 * * *' || github.event.schedule == '30 5 * * *' || github.event_name != 'schedule'
        run: |
          H=$(TZ=Europe/Berlin date +%-H)
          # Weckrufe für Mittag und Abend starten den Ablauf auch von Hand – dann baut der jeweilige
          # Schritt selbst. Hier also nur morgens bauen, sonst liefe alles doppelt.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$H" -ge 11 ]; then echo "Kein Morgenlauf um $H Uhr."; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then ARG=--nur-um-6; fi
          rueckfall() {   # frischer Bau gescheitert -> gespeicherten Stand (Video von 6:30 Uhr) behalten und posten
            git checkout -- fb/ ; git clean -fdq fb/
            if grep -q "\"datum\": \"$(TZ=Europe/Berlin date +%F)\"" fb/wetter.json 2>/dev/null; then
              M="Der frische Bau ist fehlgeschlagen – es wird das Morgenvideo von 6:30 Uhr gepostet."
            else M="Der Bau ist fehlgeschlagen und es gibt noch kein Morgenvideo von heute."; fi
            echo "::warning::$M"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Tags: warning" -H "Title: Morgenvideo" -d "$M" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          }
          baue() { python .github/scripts/fb_post.py $ARG && { if git status --porcelain fb | grep -q daten.json; then python .github/scripts/wetter_video.py; fi; }; }
          baue || rueckfall
      - name: Kurz vor dem Posten – Bild, Text und Video frisch erstellen
        if: contains(fromJSON('["20 5 * * 1-5","20 6 * * 1-5","20 6 * * 0,6","20 7 * * 0,6"]'), github.event.schedule)
        run: |
          H=$(TZ=Europe/Berlin date +%-H); D=$(TZ=Europe/Berlin date +%u); HEUTE=$(TZ=Europe/Berlin date +%F)
          AB=7; [ "$D" -ge 6 ] && AB=8
          if [ "$H" -lt "$AB" ]; then echo "Noch nicht Posting-Zeit ($H Uhr)."; exit 0; fi
          if grep -q "\"video\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Video heute schon gepostet."; exit 0; fi
          rueckfall() {   # frischer Bau gescheitert -> gespeicherten Stand (Video von 6:30 Uhr) behalten und posten
            git checkout -- fb/ ; git clean -fdq fb/
            if grep -q "\"datum\": \"$(TZ=Europe/Berlin date +%F)\"" fb/wetter.json 2>/dev/null; then
              M="Der frische Bau ist fehlgeschlagen – es wird das Morgenvideo von 6:30 Uhr gepostet."
            else M="Der Bau ist fehlgeschlagen und es gibt noch kein Morgenvideo von heute."; fi
            echo "::warning::$M"
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Tags: warning" -H "Title: Morgenvideo" -d "$M" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          }
          { python .github/scripts/fb_post.py && python .github/scripts/wetter_video.py; } || rueckfall
      - name: Mittag – Karte des Kreises (Rest des Tages) + Special-Video bei neuer Unwetterwarnung
        if: github.event.schedule == '20 10 * * *' || github.event.schedule == '20 11 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          H=$(TZ=Europe/Berlin date +%-H); HEUTE=$(TZ=Europe/Berlin date +%F)
          if [ "$H" -lt 12 ] || [ "$H" -ge 16 ]; then echo "Nicht die Mittagszeit ($H Uhr)."; exit 0; fi
          if grep -q "\"mittag\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Mittagsbeitrag heute schon gepostet."; exit 0; fi
          python .github/scripts/fb_post.py --mittag
          python .github/scripts/wetter_video.py --special
      - name: Sonntagabend – Wochenausblick-Video
        if: github.event.schedule == '20 18 * * 0' || github.event.schedule == '20 19 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          H=$(TZ=Europe/Berlin date +%-H); HEUTE=$(TZ=Europe/Berlin date +%F)
          if [ "$(TZ=Europe/Berlin date +%u)" != "7" ]; then echo "Nur sonntags."; exit 0; fi
          if [ "$H" -lt 20 ]; then echo "Noch nicht 20 Uhr ($H Uhr)."; exit 0; fi
          if grep -q "\"datum\": \"$HEUTE\"" fb/woche.json 2>/dev/null && grep -q "\"woche\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Schon erledigt."; exit 0; fi
          cp fb/post.txt fb/post.json /tmp/
          python .github/scripts/fb_post.py
          cp /tmp/post.txt /tmp/post.json fb/
          python .github/scripts/fb_post.py --abend --nur-abends || echo "Abend-Story nicht erstellt"   # Abend-Story mit dem Wetter für Montag
          python .github/scripts/wetter_video.py --woche
      - name: Nachmittag – Special-Video bei neuer Unwetterwarnung (Tagesbeitrag bleibt)
        if: github.event.schedule == '20 15 * * *'
        run: |
          cp fb/post.txt /tmp/ ; cp fb/post.json /tmp/
          python .github/scripts/fb_post.py
          cp /tmp/post.txt /tmp/post.json fb/
          python .github/scripts/wetter_video.py --special
      - name: Abends – Abendvideo aus dem Studio, Text und Abend-Story (freitags Wochenende)
        if: github.event.schedule == '20 17 * * 1-6' || github.event.schedule == '20 18 * * 1-6' || github.event_name == 'workflow_dispatch'
        run: |
          H=$(TZ=Europe/Berlin date +%-H); HEUTE=$(TZ=Europe/Berlin date +%F)
          if [ "$(TZ=Europe/Berlin date +%u)" = "7" ]; then echo "Sonntags kommt der Wochenausblick."; exit 0; fi
          if [ "$H" -lt 19 ]; then echo "Noch nicht 19 Uhr ($H Uhr)."; exit 0; fi
          if grep -q "\"abend\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Abendvideo heute schon gepostet."; exit 0; fi
          python .github/scripts/fb_post.py --abend --nur-abends
          python .github/scripts/wetter_video.py --abend
      - name: Abendtext und Abend-Story neu (nur bei Code-Änderungen)
        if: github.event_name == 'push'
        run: python .github/scripts/fb_post.py --abend
      - name: Open-Meteo-Reserve auffrischen (höchstens stündlich)
        run: python .github/scripts/fb_post.py --reserve || echo "Reserve nicht aufgefrischt"
      - name: Open-Meteo-Reserve geändert?
        id: omneu
        if: always()
        run: if [ -f /tmp/om-reserve-geaendert ]; then echo "neu=1" >> "$GITHUB_OUTPUT"; fi
      - name: Open-Meteo-Reserve sichern
        if: always() && steps.omneu.outputs.neu == '1'
        uses: actions/cache/save@v4
        with:
          path: .om-reserve
          key: om-reserve-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Sondermeldungen prüfen
        if: env.CHECK == '1'
        run: python .github/scripts/sonder.py || echo "Sondermeldung nicht möglich"
      - name: Regen-Push (Radar-Nowcast Bad König)
        if: env.CHECK == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python .github/scripts/regen_push.py
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A fb
          git diff --cached --quiet && exit 0
          git commit -m "Wetter-Beitrag $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep $((i*6)); done   # mehr Versuche (15.11.2026: Wochenausblick ging verloren)
      - name: Automatisch auf Facebook posten (direkt über Facebook)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FB_SONDER_AUTO: ${{ vars.FB_SONDER_AUTO }}
          IG_AUTO: ${{ vars.IG_AUTO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$FB_PAGE_TOKEN" ]; then echo "Kein Auto-Posting eingerichtet."; exit 0; fi
          git pull --rebase -X theirs -q || true   # neuesten Merkzettel holen (gegen Doppelposts)
          # Video (ab 7 Uhr, Sa/So ab 8 Uhr) und Abendbeitrag (ab 18 Uhr) – jeder Lauf versucht es,
          # fb_senden.py postet beides höchstens 1x pro Tag (falls GitHub den festen Termin verspätet oder auslässt)
          # Getrennte Zuständigkeit (16.11.2026): Warnungen postet nur die Viertelstunden-Prüfung, die festen
          # Beiträge die Post-Läufe. Die Prüfung holt feste Beiträge nur nach, wenn gerade kein Post-Lauf läuft.
          ANDERE=$(gh api "repos/${{ github.repository }}/actions/workflows/facebook-post.yml/runs?per_page=20" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length" 2>/dev/null || echo 1)
          if [ "$CHECK" != "1" ] || [ "$ANDERE" = "0" ]; then
          python .github/scripts/fb_senden.py video || echo "Video nicht gepostet"
          python .github/scripts/fb_senden.py mittag || echo "Mittagsbeitrag nicht gepostet"
          python .github/scripts/fb_senden.py mittagstory || echo "Mittags-Story nicht gepostet"
          python .github/scripts/fb_senden.py story || echo "Story nicht gepostet"
          python .github/scripts/fb_senden.py abend || echo "Abendvideo nicht gepostet"
          python .github/scripts/fb_senden.py abendstory || echo "Abend-Story nicht gepostet"
          python .github/scripts/fb_senden.py woche || echo "Wochenausblick nicht gepostet"
          python .github/scripts/fb_senden.py wissen || echo "Wetterwissen nicht gepostet"
          python .github/scripts/fb_senden.py jahr || echo "Jahresrückblick nicht gepostet"
          python .github/scripts/fb_senden.py monat || echo "Monatsrückblick nicht gepostet"
          else echo "Post-Lauf aktiv – feste Beiträge übernimmt der."; fi
          # DWD-Warnungen (Warn-Story, Unwetter-Story/-Special) postet seit 18.11.2026 nur noch dwd-warnung.yml
          if [ "$CHECK" = "1" ]; then
          python .github/scripts/fb_senden.py sonder || echo "Sondermeldung nicht gepostet"
          fi
          git add fb/gepostet.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Facebook: gepostet $(TZ=Europe/Berlin date +'%d.%m. %H:%M')"
          ok=0; for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q && git push && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          # Merker darf nie verloren gehen, sonst wird doppelt gepostet (16.11.2026: Dauerregen-Warnung 2x)
          if [ "$ok" != 1 ]; then python .github/scripts/merk_sichern.py || python .github/scripts/fb_senden.py merkfehler || true; fi
