name: Facebook-Vorhersage + Video

on:
  schedule:
    - cron: '30 4 * * *'   # 6:30 Uhr Sommerzeit: Bild, Text und Video erstellen (Website)
    - cron: '30 5 * * *'   # 6:30 Uhr Winterzeit
    - cron: '0 10 * * *'   # 12 Uhr Sommerzeit: Mittagsbeitrag (Karte des Kreises) + neue Unwetterwarnung? -> Special-Video
    - cron: '0 11 * * *'   # 12 Uhr Winterzeit
    - cron: '0 15 * * *'   # Nachmittag: neue Unwetterwarnung? -> Special-Video
    - cron: '0 5 * * 1-5'   # 7 Uhr Sommerzeit (Mo–Fr): Wettervideo auf Facebook
    - cron: '0 6 * * 1-5'   # 7 Uhr Winterzeit (Mo–Fr)
    - cron: '0 6 * * 0,6'   # 8 Uhr Sommerzeit (Sa/So): Wettervideo auf Facebook
    - cron: '0 7 * * 0,6'   # 8 Uhr Winterzeit (Sa/So)
    - cron: '0 17 * * 1-6'  # 19 Uhr Sommerzeit (Mo–Sa): Abendvideo aus dem Studio + Abend-Story
    - cron: '0 18 * * 1-6'  # 19 Uhr Winterzeit (Mo–Sa)
    - cron: '0 18 * * 0'    # Sonntag 20 Uhr Sommerzeit: Wochenausblick-Video
    - cron: '0 19 * * 0'    # Sonntag 20 Uhr Winterzeit
    - cron: '5,20,35,50 * * * *' # alle 15 Minuten, rund um die Uhr: Sondermeldungen / DWD-Warnungen prüfen
  workflow_dispatch:
  push:
    paths: ['.github/scripts/**', '.github/workflows/facebook-post.yml', 'video/hintergruende/**', 'video/musik/**']

permissions:
  contents: write

concurrency:
  group: repo-schreiben
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: github.event_name != 'schedule' || contains(fromJSON('["30 4 * * *","30 5 * * *","0 10 * * *","0 11 * * *","0 15 * * *","0 17 * * 1-6","0 18 * * 1-6","0 5 * * 1-5","0 6 * * 1-5","0 6 * * 0,6","0 7 * * 0,6","0 18 * * 0","0 19 * * 0"]'), github.event.schedule)
        timeout-minutes: 5
      - run: pip install pillow numpy edge-tts
      - name: Morgens – Bild, Text und Wettervideo
        if: github.event.schedule == '30 4 * * *' || github.event.schedule == '30 5 * * *' || github.event_name != 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ARG=--nur-um-6; fi
          python .github/scripts/fb_post.py $ARG
          if git status --porcelain fb | grep -q daten.json; then python .github/scripts/wetter_video.py; fi
      - name: Kurz vor dem Posten – Bild, Text und Video frisch erstellen
        if: contains(fromJSON('["0 5 * * 1-5","0 6 * * 1-5","0 6 * * 0,6","0 7 * * 0,6"]'), github.event.schedule)
        run: |
          H=$(TZ=Europe/Berlin date +%-H); D=$(TZ=Europe/Berlin date +%u); HEUTE=$(TZ=Europe/Berlin date +%F)
          AB=7; [ "$D" -ge 6 ] && AB=8
          if [ "$H" -lt "$AB" ]; then echo "Noch nicht Posting-Zeit ($H Uhr)."; exit 0; fi
          if grep -q "\"video\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Video heute schon gepostet."; exit 0; fi
          python .github/scripts/fb_post.py
          python .github/scripts/wetter_video.py
      - name: Mittag – Karte des Kreises (Rest des Tages) + Special-Video bei neuer Unwetterwarnung
        if: github.event.schedule == '0 10 * * *' || github.event.schedule == '0 11 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          H=$(TZ=Europe/Berlin date +%-H); HEUTE=$(TZ=Europe/Berlin date +%F)
          if [ "$H" -lt 12 ] || [ "$H" -ge 16 ]; then echo "Nicht die Mittagszeit ($H Uhr)."; exit 0; fi
          if grep -q "\"mittag\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Mittagsbeitrag heute schon gepostet."; exit 0; fi
          python .github/scripts/fb_post.py --mittag
          python .github/scripts/wetter_video.py --special
      - name: Sonntagabend – Wochenausblick-Video
        if: github.event.schedule == '0 18 * * 0' || github.event.schedule == '0 19 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          H=$(TZ=Europe/Berlin date +%-H); HEUTE=$(TZ=Europe/Berlin date +%F)
          if [ "$(TZ=Europe/Berlin date +%u)" != "7" ]; then echo "Nur sonntags."; exit 0; fi
          if [ "$H" -lt 20 ]; then echo "Noch nicht 20 Uhr ($H Uhr)."; exit 0; fi
          if grep -q "\"datum\": \"$HEUTE\"" fb/woche.json 2>/dev/null && grep -q "\"woche\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Schon erledigt."; exit 0; fi
          cp fb/post.jpg fb/post.txt fb/post.json /tmp/
          python .github/scripts/fb_post.py
          cp /tmp/post.jpg /tmp/post.txt /tmp/post.json fb/
          python .github/scripts/wetter_video.py --woche
      - name: Nachmittag – Special-Video bei neuer Unwetterwarnung (Tagesbeitrag bleibt)
        if: github.event.schedule == '0 15 * * *'
        run: |
          cp fb/post.jpg /tmp/ ; cp fb/post.txt /tmp/ ; cp fb/post.json /tmp/
          python .github/scripts/fb_post.py
          cp /tmp/post.jpg /tmp/post.txt /tmp/post.json fb/
          python .github/scripts/wetter_video.py --special
      - name: Abends – Abendvideo aus dem Studio, Text und Abend-Story (freitags Wochenende)
        if: github.event.schedule == '0 17 * * 1-6' || github.event.schedule == '0 18 * * 1-6' || github.event_name == 'workflow_dispatch'
        run: |
          H=$(TZ=Europe/Berlin date +%-H); HEUTE=$(TZ=Europe/Berlin date +%F)
          if [ "$(TZ=Europe/Berlin date +%u)" = "7" ]; then echo "Sonntags kommt der Wochenausblick."; exit 0; fi
          if [ "$H" -lt 19 ]; then echo "Noch nicht 19 Uhr ($H Uhr)."; exit 0; fi
          if grep -q "\"abend\": \"$HEUTE\"" fb/gepostet.json 2>/dev/null; then echo "Abendvideo heute schon gepostet."; exit 0; fi
          python .github/scripts/fb_post.py --abend --nur-abends
          python .github/scripts/wetter_video.py --abend
      - name: Abendtext und Abend-Story neu (nur bei Code-Änderungen)
        if: github.event_name == 'push'
        run: python .github/scripts/fb_post.py --abend
      - name: Sondermeldungen prüfen
        run: python .github/scripts/sonder.py || echo "Sondermeldung nicht möglich"
      - name: Regen-Push (Radar-Nowcast Bad König)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python .github/scripts/regen_push.py
      - name: DWD-Warn-Push (amtliche Warnungen Bad König)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python .github/scripts/dwd_push.py
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A fb
          git diff --cached --quiet && exit 0
          git commit -m "Wetter-Beitrag $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Automatisch auf Facebook posten (direkt über Facebook)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_SONDER_AUTO: ${{ vars.FB_SONDER_AUTO }}
          IG_AUTO: ${{ vars.IG_AUTO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$FB_PAGE_TOKEN" ]; then echo "Kein Auto-Posting eingerichtet."; exit 0; fi
          git pull --rebase -X theirs -q || true   # neuesten Merkzettel holen (gegen Doppelposts)
          # Video (ab 7 Uhr, Sa/So ab 8 Uhr) und Abendbeitrag (ab 18 Uhr) – jeder Lauf versucht es,
          # fb_senden.py postet beides höchstens 1x pro Tag (falls GitHub den festen Termin verspätet oder auslässt)
          python .github/scripts/fb_senden.py video || echo "Video nicht gepostet"
          python .github/scripts/fb_senden.py mittag || echo "Mittagsbeitrag nicht gepostet"
          python .github/scripts/fb_senden.py story || echo "Story nicht gepostet"
          python .github/scripts/fb_senden.py abend || echo "Abendvideo nicht gepostet"
          python .github/scripts/fb_senden.py abendstory || echo "Abend-Story nicht gepostet"
          python .github/scripts/fb_senden.py woche || echo "Wochenausblick nicht gepostet"
          python .github/scripts/fb_senden.py jahr || echo "Jahresrückblick nicht gepostet"
          python .github/scripts/fb_senden.py sonder || echo "Sondermeldung nicht gepostet"
          git add fb/gepostet.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Facebook: gepostet $(TZ=Europe/Berlin date +'%d.%m. %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
