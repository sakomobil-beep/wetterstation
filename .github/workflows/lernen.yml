name: Vorhersage lernen

on:
  schedule:
    - cron: '20 */3 * * *'   # alle 3 Stunden: Messwerte + Modell sammeln, Korrektur neu lernen
  workflow_dispatch:
  push:
    paths: ['.github/scripts/lernen.py', '.github/scripts/lernen_kreis.py', '.github/workflows/lernen.yml']

permissions:
  contents: write

concurrency:
  group: repo-schreiben
  cancel-in-progress: false

jobs:
  lernen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/scripts/lernen.py
      - run: python .github/scripts/lernen_kreis.py || echo "Kreis-Lernen fehlgeschlagen"
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Vorhersage gelernt $(TZ=Europe/Berlin date +'%d.%m. %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
