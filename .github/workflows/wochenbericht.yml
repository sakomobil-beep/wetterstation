name: Wochenbericht (Gesundheit)

# 22.11.2026: jeden Sonntag nach dem Wochenausblick – Posts, fehlgeschlagene Abläufe und Datenlücken der Woche.
# Liest nur, schreibt nur data/gesundheit.json. Push nur, wenn es Hinweise gibt.
on:
  schedule:
    - cron: '40 20 * * 0'   # Sonntag 21:40 Uhr Winterzeit / 22:40 Uhr Sommerzeit (nach dem Wochenausblick um 20 Uhr)
  workflow_dispatch:
    inputs:
      push:
        description: 'Push-Nachricht senden (bei Hinweisen)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: wochenbericht
  cancel-in-progress: false

jobs:
  bericht:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verlauf der letzten 2 Wochen holen
        run: git fetch -q --shallow-since="$(date -d '16 days ago' +%Y-%m-%d)" origin ${{ github.ref_name }} || true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/scripts/wochenbericht.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEIN_PUSH: ${{ github.event_name == 'workflow_dispatch' && !inputs.push && '1' || '0' }}
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gesundheit.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Wochenbericht $(TZ=Europe/Berlin date +'%d.%m.%Y')"
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 7; done
