name: Facebook/Instagram-Statistik holen (nur lesen)
on:
  schedule:
    - cron: '10 2 * * *'   # 3:10 Uhr Winterzeit
  workflow_dispatch:
  push:
    paths: ['.github/scripts/social_insights.py']
permissions:
  contents: write
concurrency:
  group: nebenarbeiten
  cancel-in-progress: false
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Statistik abholen
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 .github/scripts/social_insights.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fb/insights.json
          git commit -m "Facebook/Instagram-Statistik $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
