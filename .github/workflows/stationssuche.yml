name: Stationssuche (einmalig)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: repo-schreiben
  cancel-in-progress: false
jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/scripts/stationssuche.py
      - run: |
          git config user.name "wetter-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/stationen-kandidaten.json; git diff --cached --quiet && exit 0
          git commit -m "Stationssuche"; for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
